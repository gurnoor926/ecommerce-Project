<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../Style/Main.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!--Font Awesome-->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css"
      integrity="sha512-PgQMlq+nqFLV4ylk1gwUOgm6CtIIXkKwaIHp/PAIWHzig/lKZSEGKEys
h0TCVbHJXCLN7WetD8TFecIky75ZfQ=="
      crossorigin="anonymous"
    />
    <title>E-commerce</title>
  </head>
  <body>
    <!--navbar-->
    <section class="header_menu" id="header_menu"></section>
    <!--contact us section-->
    <section class="contact-us mt-3 mb-5" id="contact-us">
      <div class="container">
        <div class="section_heading">
          <h2 class="text-center text-decoration-underline mb-3">Contact Us</h2>
        </div>
        <div class="row text-white mt-5 pt-5 gap-5 justify-content-center ms-1">
          <!-- contact 1-->
          <div class="col col-md-2 col-lg-3 p-3 shadow">
            <div class="text-center">
              <div class="Feature-icon mb-3 mt-3">
                <i class="fa-solid fa-phone text-dark"></i>
              </div>
              <div class="feature-title text-dark">
                <h3 class="fs-5">Call at- 687844566</h3>
              </div>
            </div>
          </div>
          <!-- contact 2-->
          <div class="col col-md-2 col-lg-3 p-3 shadow">
            <div class="text-center">
              <div class="Feature-icon mb-3 mt-3">
                <i class="fa-solid fa-envelope text-dark fs-3"></i>
              </div>
              <div class="feature-title text-dark">
                <h3 class="fs-5">Mail at- example@gmail.com</h3>
              </div>
            </div>
          </div>
          <!-- contact 3-->
          <div class="col col-md-2 col-lg-3 p-3 shadow">
            <div class="text-center">
              <div class="Feature-icon mb-3 mt-3">
                <i class="fa-solid fa-network-wired text-dark fs-3"></i>
              </div>
              <div class="feature-title text-dark">
                <h3 class="fs-5">support 24/7 - 1800054866</h3>
              </div>
            </div>
          </div>
        </div>
        <div class="row justify-content-center mt-5 pt-5">
          <div class="col shadow p-4 col-md-6">
            <div class="form_heading">
              <h3 class="text-center mt-3">contact Form</h3>
            </div>
            <div class="mb-3">
              <label for="nameInput" class="form-label"
                >Name</label
              >
              <input
                type="text"
                class="form-control"
                id="nameInput"
                placeholder="Enter your name"
              />
            </div>
            <div class="mb-3">
              <label for="emailInput" class="form-label"
                >Email address</label
              >
              <input
                type="email"
                class="form-control"
                id="emailInput"
                placeholder="name@example.com"
              />
            </div>
            <div class="mb-3">
              <label for="messageInput" class="form-label"
                >Example textarea <span class="badge text-bg-secondary">Min-10</span></label
              >
              <textarea
                class="form-control"
                id="messageInput"
                rows="3"
              ></textarea>
            </div>
            <div class="col-auto">
              <button type="submit" class="btn btn-primary mb-3 w-100" id="submitBtn">
                submit
              </button>
            </div>
          </div>
        </div>
      </div>
    </section>
    <!--footer-->
    <section
      class="footer_section pt-5 pb-2 border-top"
      id="footer_section"
    ></section>
    <!--back to top button-->
    <div class="backtop position-fixed bottom-0 end-0 mb-5 pb-5 me-3">
      <a
        id="button"
        href="#top"
        class="btn btn-lg btn-outline-danger"
        role="button"
      >
        <i class="fas fa-chevron-up text-dark"></i>
      </a>
    </div>
    <script
      src="https://code.jquery.com/jquery-3.5.1.slim.min.js"
      integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+
OrCXaRkfj"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"
      integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7ni
u735Sk7lN"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://kit.fontawesome.com/ad46e66a6a.js"
      crossorigin="anonymous"
    ></script>
    <script src="../Script/App.js"></script>
    <script src="../Script/formValidation.js"></script>
  </body>
</html>
