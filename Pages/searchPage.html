<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../Style/Main.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!--Font Awesome-->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css"
      integrity="sha512-PgQMlq+nqFLV4ylk1gwUOgm6CtIIXkKwaIHp/PAIWHzig/lKZSEGKEys
h0TCVbHJXCLN7WetD8TFecIky75ZfQ=="
      crossorigin="anonymous"
    />
    <title>E-commerce</title>
  </head>
  <body>
    <!--navbar-->
    <section class="header_menu" id="header_menu"></section>
    <!--search section-->
    <section class="search_section py-4 mt-5" id="search_section">
      <div class="container">
        <div class="row">
          <div class="col">
            <form class="d-flex" role="search">
              <input
                class="form-control me-2"
                type="search"
                placeholder="Search"
                aria-label="Search"
              />
              <button class="btn btn-outline-success" type="submit">
                Search
              </button>
            </form>
          </div>
        </div>
        <div class="row mt-5">
          <div class="search_heading">
            <h2>Search Results</h2>
          </div>
          <div class="col border shadow-lg justify-content-center align-items-center d-flex flex-column w-75 mx-auto">
            <!--card 1-->
            <div class="card mb-3 mt-3 w-75">
              <div class="card-body">
                <div class="d-flex justify-content-between">
                  <div class="d-flex flex-row align-items-center">
                    <div>
                      <img
                        src="https://images.unsplash.com/photo-1614214191247-5b2d3a734f1b?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MjB8fGhvb2RpZXxlbnwwfDF8MHx8fDI%3D"
                        class="img-fluid rounded-3"
                        alt="Shopping item"
                        style="width: 80px"
                      />
                    </div>
                    <div class="ms-3 text-center">
                      <h5 class="fs-3">Lorem, ipsum.</h5>
                      <p class="small mb-0 fs-5">Lorem, ipsum dolor.</p>
                    </div>
                    <div style="width: 80px" class="ms-5 me-0">
                      <h5 class="mb-0">$20</h5>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <!--card 2-->
            <div class="card mb-3 mt-3 w-75">
              <div class="card-body">
                <div class="d-flex justify-content-between">
                  <div class="d-flex flex-row align-items-center">
                    <div>
                      <img
                        src="https://images.unsplash.com/photo-1614214191247-5b2d3a734f1b?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MjB8fGhvb2RpZXxlbnwwfDF8MHx8fDI%3D"
                        class="img-fluid rounded-3"
                        alt="Shopping item"
                        style="width: 80px"
                      />
                    </div>
                    <div class="ms-3 text-center">
                      <h5 class="fs-3">Lorem, ipsum.</h5>
                      <p class="small mb-0 fs-5">Lorem, ipsum dolor.</p>
                    </div>
                    <div style="width: 80px" class="ms-5 me-0">
                      <h5 class="mb-0">$20</h5>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <!--card 3-->
            <div class="card mb-3 mt-3 w-75">
              <div class="card-body">
                <div class="d-flex justify-content-between">
                  <div class="d-flex flex-row align-items-center">
                    <div>
                      <img
                        src="https://images.unsplash.com/photo-1614214191247-5b2d3a734f1b?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MjB8fGhvb2RpZXxlbnwwfDF8MHx8fDI%3D"
                        class="img-fluid rounded-3"
                        alt="Shopping item"
                        style="width: 80px"
                      />
                    </div>
                    <div class="ms-3 text-center">
                      <h5 class="fs-3">Lorem, ipsum.</h5>
                      <p class="small mb-0 fs-5">Lorem, ipsum dolor.</p>
                    </div>
                    <div style="width: 80px" class="ms-5 me-0">
                      <h5 class="mb-0">$20</h5>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
    <!--footer-->
    <section
      class="footer_section pt-5 pb-2 border-top"
      id="footer_section"
    ></section>
    <!--back to top button-->
    <div class="backtop position-fixed bottom-0 end-0 mb-5 pb-5 me-3">
      <a
        id="button"
        href="#top"
        class="btn btn-lg btn-outline-danger"
        role="button"
      >
        <i class="fas fa-chevron-up text-dark"></i>
      </a>
    </div>
    <script
      src="https://code.jquery.com/jquery-3.5.1.slim.min.js"
      integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+
OrCXaRkfj"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"
      integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7ni
u735Sk7lN"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://kit.fontawesome.com/ad46e66a6a.js"
      crossorigin="anonymous"
    ></script>
    <script src="../Script/App.js"></script>
  </body>
</html>
