<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="Main.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!--Font Awesome-->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css"
      integrity="sha512-PgQMlq+nqFLV4ylk1gwUOgm6CtIIXkKwaIHp/PAIWHzig/lKZSEGKEys
h0TCVbHJXCLN7WetD8TFecIky75ZfQ=="
      crossorigin="anonymous"
    />
    <title>E-commerce</title>
  </head>
  <body>
    <!--navbar-->
    <section class="header_menu" id="header_menu"></section>
    <!--cart items-->
    <section class="cart_section">
      <div class="container py-5 h-100">
        <div class="row d-flex justify-content-center align-items-center h-100">
          <div class="col">
            <div class="card">
              <div class="card-body p-4">
                <div class="row">
                  <div class="col-lg-7">
                    <h5 class="mb-3">
                      <a href="./index.html" class="text-body"
                        ><i class="fas fa-long-arrow-alt-left me-2"></i>Continue
                        shopping</a
                      >
                    </h5>
                    <hr />

                    <div
                      class="d-flex justify-content-between align-items-center mb-4"
                    >
                      <div>
                        <p class="mb-1">Shopping cart</p>
                        <p class="mb-0">You have 2 items in your cart</p>
                      </div>
                      <div>
                        <p class="mb-0">
                          <span class="text-muted">Sort by:</span>
                          <a href="#!" class="text-body"
                            >price <i class="fas fa-angle-down mt-1"></i
                          ></a>
                        </p>
                      </div>
                    </div>
                    <!--card 1-->
                    <div class="card mb-3">
                      <div class="card-body">
                        <div class="d-flex justify-content-between">
                          <div class="d-flex flex-row align-items-center">
                            <div>
                              <img
                                src="https://images.unsplash.com/photo-1614214191247-5b2d3a734f1b?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MjB8fGhvb2RpZXxlbnwwfDF8MHx8fDI%3D"
                                class="img-fluid rounded-3"
                                alt="Shopping item"
                                style="width: 65px"
                              />
                            </div>
                            <div class="ms-3">
                              <h5>Lorem, ipsum.</h5>
                              <p class="small mb-0">Lorem, ipsum dolor.</p>
                            </div>
                          </div>
                          <div class="d-flex flex-row align-items-center">
                            <div
                              class="d-flex align-items-center mb-3 mt-3 me-3"
                            >
                              <label for="sizeSelect" class="me-2 fw-bold"
                                >Quantity:</label
                              >
                              <select
                                id="sizeSelect"
                                class="form-select w-auto"
                              >
                                <option value="1">1</option>
                                <option value="10">10</option>
                                <option value="100">100</option>
                                <option value="1000">1000</option>
                              </select>
                            </div>
                            <div style="width: 80px">
                              <h5 class="mb-0">$20</h5>
                            </div>
                            <a href="#!" style="color: #cecece"
                              ><i class="fas fa-trash-alt"></i
                            ></a>
                          </div>
                        </div>
                      </div>
                    </div>
                    <!--card 2-->
                    <div class="card mb-3">
                      <div class="card-body">
                        <div class="d-flex justify-content-between">
                          <div class="d-flex flex-row align-items-center">
                            <div>
                              <img
                                src="https://images.unsplash.com/photo-1614214191247-5b2d3a734f1b?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MjB8fGhvb2RpZXxlbnwwfDF8MHx8fDI%3D"
                                class="img-fluid rounded-3"
                                alt="Shopping item"
                                style="width: 65px"
                              />
                            </div>
                            <div class="ms-3">
                              <h5>Lorem, ipsum.</h5>
                              <p class="small mb-0">Lorem, ipsum dolor.</p>
                            </div>
                          </div>
                          <div class="d-flex flex-row align-items-center">
                            <div
                              class="d-flex align-items-center mb-3 mt-3 me-3"
                            >
                              <label for="sizeSelect" class="me-2 fw-bold"
                                >Quantity:</label
                              >
                              <select
                                id="sizeSelect"
                                class="form-select w-auto"
                              >
                                <option value="1">1</option>
                                <option value="10">10</option>
                                <option value="100">100</option>
                                <option value="1000">1000</option>
                              </select>
                            </div>
                            <div style="width: 80px">
                              <h5 class="mb-0">$20</h5>
                            </div>
                            <a href="#!" style="color: #cecece"
                              ><i class="fas fa-trash-alt"></i
                            ></a>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                  <!--total-->
                  <div class="col-lg-5">
                    <div class="card bg-primary text-white rounded-3">
                      <div class="card-body">
                        <div class="d-flex justify-content-between">
                          <p class="mb-2">Subtotal</p>
                          <p class="mb-2">$40</p>
                        </div>

                        <div class="d-flex justify-content-between">
                          <p class="mb-2">Shipping</p>
                          <p class="mb-2">$5</p>
                        </div>

                        <div class="d-flex justify-content-between mb-4">
                          <p class="mb-2">Total(Incl. taxes)</p>
                          <p class="mb-2">$45</p>
                        </div>
                        <a href="./checkout.html" class="btn btn-success">
                          <div class="d-flex justify-content-between">
                            <span class="me-2">$45</span>
                            <span
                              >Checkout
                              <i class="fas fa-long-arrow-alt-right ms-2"></i
                            ></span></div
                        ></a>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
    <!--footer-->
    <section
      class="footer_section pt-5 pb-2 border-top"
      id="footer_section"
    ></section>
    <!--back to top button-->
    <div class="backtop position-fixed bottom-0 end-0 mb-5 pb-5 me-3">
      <a
        id="button"
        href="#top"
        class="btn btn-lg btn-outline-danger"
        role="button"
      >
        <i class="fas fa-chevron-up text-dark"></i>
      </a>
    </div>
    <script
      src="https://code.jquery.com/jquery-3.5.1.slim.min.js"
      integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+
OrCXaRkfj"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"
      integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7ni
u735Sk7lN"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://kit.fontawesome.com/ad46e66a6a.js"
      crossorigin="anonymous"
    ></script>
    <script src="./App.js"></script>
  </body>
</html>
