<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="Main.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!--Font Awesome-->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css"
      integrity="sha512-PgQMlq+nqFLV4ylk1gwUOgm6CtIIXkKwaIHp/PAIWHzig/lKZSEGKEys
h0TCVbHJXCLN7WetD8TFecIky75ZfQ=="
      crossorigin="anonymous"
    />
    <title>E-commerce</title>
  </head>
  <body>
    <!--headerSection-->
    <section class="header_menu" id="header_menu"></section>
    <!--product view section-->
    <section class="product_view_section pt-5 pb-5" id="product_view_section">
      <div class="container">
        <div class="heading">
          <h2 class="text-center">Product-details</h2>
        </div>
        <div class="row">
          <div class="col col-md-12 col-lg-5 mt-5">
            <div class="product-image h-75 mt-3 border-end">
              <img
                src="https://images.unsplash.com/photo-1614214191247-5b2d3a734f1b?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MjB8fGhvb2RpZXxlbnwwfDF8MHx8fDI%3D"
                class="img-fluid h-100 border border-primary-subtle"
                alt=""
              />
            </div>
          </div>
          <div class="col mt-5 col-md-12 col-lg-7">
            <div class="product-desc mt-3">
              <h3 class="product-title">Lorem, ipsum.</h3>
              <p class="product-price h4 text-danger">$49.99</p>
              <p class="product-description">
                Lorem ipsum dolor sit amet consectetur adipisicing elit.
                Laudantium dolorem maxime voluptatibus distinctio cumque,
                commodi sit rem libero cupiditate beatae.
              </p>
              <h6 class="Rating text-start text-warning fs-6 mt-3 mb-3">
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-regular fa-star"></i>
              </h6>
              <div class="d-flex align-items-center mb-3 mt-3">
                <label for="sizeSelect" class="me-2 fw-bold">Quantity:</label>
                <select id="sizeSelect" class="form-select w-auto">
                  <option value="1">1</option>
                  <option value="10">10</option>
                  <option value="100">100</option>
                  <option value="1000">1000</option>
                </select>
              </div>
              <button class="btn btn-danger btn-lg mt-2 mb-5">Add to Cart</button>
            </div>
          </div>
        </div>
        <div class="related-products mt-5">
          <div><h4>Related Products</h4></div>
          <div class="row gap-5 justify-content-center container-fluid">
            <!--product card 1-->
            <div class="col col-md-5 col-lg-3 mt-4">
              <div class="card bg-light border border-secondary-subtle">
                <img
                  src="https://images.unsplash.com/photo-1614214191247-5b2d3a734f1b?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MjB8fGhvb2RpZXxlbnwwfDF8MHx8fDI%3D"
                  class="card-img-top product-card-img"
                  alt="..."
                />
                <div class="card-body text-center">
                  <h4>
                    <a
                      href="Product-details.html"
                      class="text-decoration-none fs-5 text-secondary-emphasis"
                      >Lorem ipsum dolor sit.</a
                    >
                  </h4>
                </div>
              </div>
            </div>
            <!--product card 2-->
            <div class="col col-md-5 col-lg-3 mt-4">
              <div class="card bg-light border border-secondary-subtle">
                <img
                  src="https://images.unsplash.com/photo-1614214191247-5b2d3a734f1b?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MjB8fGhvb2RpZXxlbnwwfDF8MHx8fDI%3D"
                  class="card-img-top product-card-img"
                  alt="..."
                />
                <div class="card-body text-center">
                  <h4>
                    <a
                      href="Product-details.html"
                      class="text-decoration-none fs-5 text-secondary-emphasis"
                      >Lorem ipsum dolor sit.</a
                    >
                  </h4>
                </div>
              </div>
            </div>
            <!--product card 3-->
            <div class="col col-md-5 col-lg-3 mt-4">
              <div class="card bg-light border border-secondary-subtle">
                <img
                  src="https://images.unsplash.com/photo-1614214191247-5b2d3a734f1b?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MjB8fGhvb2RpZXxlbnwwfDF8MHx8fDI%3D"
                  class="card-img-top product-card-img"
                  alt="..."
                />
                <div class="card-body text-center">
                  <h4>
                    <a
                      href="Product-details.html"
                      class="text-decoration-none fs-5 text-secondary-emphasis"
                      >Lorem ipsum dolor sit.</a
                    >
                  </h4>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
    <!--footer section-->
    <section
      class="footer_section pt-5 pb-2 border-top"
      id="footer_section"
    ></section>
    <!--back to top button-->
    <div class="backtop position-fixed bottom-0 end-0 mb-5 pb-5 me-3">
      <a
        id="button"
        href="#top"
        class="btn btn-lg btn-outline-danger"
        role="button"
      >
        <i class="fas fa-chevron-up text-dark"></i>
      </a>
    </div>
    <script
      src="https://code.jquery.com/jquery-3.5.1.slim.min.js"
      integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+
OrCXaRkfj"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"
      integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7ni
u735Sk7lN"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://kit.fontawesome.com/ad46e66a6a.js"
      crossorigin="anonymous"
    ></script>
    <script src="./App.js"></script>
  </body>
</html>
